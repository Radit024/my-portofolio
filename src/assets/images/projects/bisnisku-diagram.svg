<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131e"/>
      <stop offset="50%" stop-color="#0f2133"/>
      <stop offset="100%" stop-color="#142c42"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1120" height="700" fill="url(#finBg)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="140" x2="1120" y2="140"/>
    <line x1="0" y1="280" x2="1120" y2="280"/>
    <line x1="0" y1="420" x2="1120" y2="420"/>
    <line x1="0" y1="560" x2="1120" y2="560"/>
    <line x1="280" y1="0" x2="280" y2="700"/>
    <line x1="560" y1="0" x2="560" y2="700"/>
    <line x1="840" y1="0" x2="840" y2="700"/>
  </g>

  <!-- Header -->
  <g fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="70" y="110" font-size="52" font-weight="700" fill="#f8fafc">BisnisKu Financial Platform</text>
    <text x="72" y="150" font-size="20" fill="#94a3b8" font-weight="500">Corporate &amp; SME Bookkeeping, Production Unit Costing &amp; P&amp;L Analysis</text>
  </g>

  <!-- Connecting Arrows -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)">
    <path d="M260 330H305"/>
    <path d="M515 330H560"/>
    <path d="M770 330H815"/>
  </g>

  <!-- Process Cards -->
  <!-- Card 1: Transaction Ledger -->
  <g fill="#16273b" stroke="#1f4263" stroke-width="2">
    <rect x="65" y="240" width="195" height="180" rx="16"/>
  </g>
  <circle cx="162" cy="285" r="24" fill="rgba(16,185,129,0.15)"/>
  <text x="162" y="292" font-size="20" fill="#34d399" text-anchor="middle" font-family="sans-serif">💰</text>
  <text x="162" y="340" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="middle" font-family="sans-serif">Cash Flow</text>
  <text x="162" y="370" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">Income &amp; Expense</text>
  <text x="162" y="392" font-size="13" fill="#64748b" text-anchor="middle" font-family="sans-serif">Multi-Method</text>

  <!-- Card 2: Material & Inventory Costing -->
  <g fill="#16273b" stroke="#1f4263" stroke-width="2">
    <rect x="320" y="240" width="195" height="180" rx="16"/>
  </g>
  <circle cx="417" cy="285" r="24" fill="rgba(56,189,248,0.15)"/>
  <text x="417" y="292" font-size="20" fill="#38bdf8" text-anchor="middle" font-family="sans-serif">📦</text>
  <text x="417" y="340" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="middle" font-family="sans-serif">Unit Costing</text>
  <text x="417" y="370" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">Raw Material HPP</text>
  <text x="417" y="392" font-size="13" fill="#64748b" text-anchor="middle" font-family="sans-serif">Stock Valuation</text>

  <!-- Card 3: Batch Production -->
  <g fill="#16273b" stroke="#1f4263" stroke-width="2">
    <rect x="575" y="240" width="195" height="180" rx="16"/>
  </g>
  <circle cx="672" cy="285" r="24" fill="rgba(251,191,36,0.15)"/>
  <text x="672" y="292" font-size="20" fill="#fbbf24" text-anchor="middle" font-family="sans-serif">🏭</text>
  <text x="672" y="340" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="middle" font-family="sans-serif">Production</text>
  <text x="672" y="370" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">Batch Cost Margin</text>
  <text x="672" y="392" font-size="13" fill="#64748b" text-anchor="middle" font-family="sans-serif">Yield Efficiency</text>

  <!-- Card 4: Financial Statements -->
  <g fill="#16273b" stroke="rgba(56,189,248,0.5)" stroke-width="2">
    <rect x="830" y="240" width="195" height="180" rx="16"/>
  </g>
  <circle cx="927" cy="285" r="24" fill="rgba(56,189,248,0.2)"/>
  <text x="927" y="292" font-size="20" fill="#38bdf8" text-anchor="middle" font-family="sans-serif">📊</text>
  <text x="927" y="340" font-size="19" font-weight="700" fill="#38bdf8" text-anchor="middle" font-family="sans-serif">P&amp;L Analytics</text>
  <text x="927" y="370" font-size="14" fill="#cbd5e1" text-anchor="middle" font-family="sans-serif">Financial Reports</text>
  <text x="927" y="392" font-size="13" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">Gross &amp; Net Margin</text>

  <!-- Bottom Badges / Metrics -->
  <g transform="translate(65, 480)">
    <rect x="0" y="0" width="300" height="90" rx="16" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>
    <text x="24" y="38" font-size="13" font-weight="600" fill="#38bdf8" font-family="sans-serif">DATA INTEGRITY</text>
    <text x="24" y="68" font-size="18" font-weight="700" fill="#f8fafc" font-family="sans-serif">Drizzle ORM &amp; SQL Schema</text>
  </g>

  <g transform="translate(410, 480)">
    <rect x="0" y="0" width="300" height="90" rx="16" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.25)" stroke-width="1.5"/>
    <text x="24" y="38" font-size="13" font-weight="600" fill="#34d399" font-family="sans-serif">UNIT ECONOMICS</text>
    <text x="24" y="68" font-size="18" font-weight="700" fill="#f8fafc" font-family="sans-serif">Real-Time Cost Tracking</text>
  </g>

  <g transform="translate(755, 480)">
    <rect x="0" y="0" width="300" height="90" rx="16" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.25)" stroke-width="1.5"/>
    <text x="24" y="38" font-size="13" font-weight="600" fill="#fbbf24" font-family="sans-serif">ENTERPRISE READINESS</text>
    <text x="24" y="68" font-size="18" font-weight="700" fill="#f8fafc" font-family="sans-serif">P&amp;L Statements &amp; Audit</text>
  </g>
</svg>
